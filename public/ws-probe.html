<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Probe</title>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 600px; margin: 0 auto; }
    #log { white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 4px; min-height: 200px; }
    input { width: 70%; padding: 8px; }
    button { padding: 8px 16px; }
    .ok { color: green; }
    .err { color: red; }
  </style>
</head>
<body>
  <h1>WebSocket Probe</h1>
  <p>Connects to <code id="url"></code></p>
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
  <input id="msg" placeholder="Type a message..." disabled>
  <button id="send" disabled>Send</button>
  <div id="log"></div>
  <script>
    var ws = null;
    var logEl = document.getElementById('log');
    var urlEl = document.getElementById('url');
    var connectBtn = document.getElementById('connect');
    var disconnectBtn = document.getElementById('disconnect');
    var msgInput = document.getElementById('msg');
    var sendBtn = document.getElementById('send');

    // Use the same origin as the page
    var wsUrl = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + window.location.host + '/api/ws';
    urlEl.textContent = wsUrl;

    function log(msg, cls) {
      var line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = new Date().toISOString() + ' ' + msg;
      logEl.appendChild(line);
    }

    connectBtn.onclick = function() {
      log('Connecting to ' + wsUrl + '...');
      ws = new WebSocket(wsUrl);
      ws.onopen = function() {
        log('✓ WebSocket connected', 'ok');
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        msgInput.disabled = false;
        sendBtn.disabled = false;
      };
      ws.onmessage = function(ev) {
        log('← ' + ev.data, 'ok');
      };
      ws.onerror = function(ev) {
        log('✗ WebSocket error', 'err');
      };
      ws.onclose = function() {
        log('WebSocket closed');
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        msgInput.disabled = true;
        sendBtn.disabled = true;
      };
    };

    disconnectBtn.onclick = function() {
      if (ws) ws.close();
    };

    sendBtn.onclick = function() {
      if (ws && msgInput.value) {
        var msg = msgInput.value;
        log('→ ' + msg);
        ws.send(msg);
        msgInput.value = '';
      }
    };

    msgInput.onkeydown = function(e) {
      if (e.key === 'Enter') sendBtn.click();
    };
  </script>
</body>
</html>

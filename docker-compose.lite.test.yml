# Test-only Compose override for Lite — exposes app, caddy, and postgres ports.
services:
  app:
    ports:
      - "3000:3000"
    environment:
      # Test-only: enables mock OTP (code 123456) so tests can use the
      # 3-step OTP signup flow without a real Nixify API key.
      # Production docker-compose.lite.yml must NOT set this.
      NIXIFY_MOCK: "true"
      # Test-only: dedicated test-harness flag for dev-only test routes.
      # Production compose + Vercel must NOT set this. See BLOCKER 3.
      SUKHAN_TEST_HARNESS: "true"

  caddy:
    ports:
      - "81:80"
      - "443:443"

  # Expose Postgres on the host so the bun db-boundary test runner (which
  # runs on the CI host, connects to the exposed Docker Postgres port).
  # Production docker-compose.lite.yml does NOT expose this port.
  postgres:
    ports:
      - "5432:5432"

name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/vercel-deployment]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
      - name: Lint
        run: bun run lint
      - name: TypeScript check
        run: bun run typecheck
      - name: Prisma validate
        run: bunx prisma validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
      - name: Vercel build script syntax check
        run: bash -n vercel-build.sh
      - name: Unit tests
        run: bun test tests/unit/
      - name: Production build
        run: bunx next build
        env:
          VERCEL: '1'
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
          NIXIFY_MOCK: 'true'
          NEXTAUTH_SECRET: 'ci-test-secret-not-for-production'

  docker-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start Docker stack
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up -d --build
        env:
          NEXTAUTH_SECRET: ci-docker-test-secret
          POSTGRES_PASSWORD: ci-postgres-password
          NIXIFY_MOCK: "true"
      - name: Wait for health
        run: |
          echo "Waiting for services to be healthy..."
          timeout 120 bash -c '
            while true; do
              APP=$(curl -sf http://127.0.0.1:3000/api 2>/dev/null && echo ok || echo fail)
              CADDY=$(curl -sf http://127.0.0.1:81/api 2>/dev/null && echo ok || echo fail)
              if [ "$APP" = "ok" ] && [ "$CADDY" = "ok" ]; then
                echo "All services healthy"
                exit 0
              fi
              echo "  app=$APP caddy=$CADDY"
              sleep 5
            done
          '
      - name: Run Docker regression tests
        run: |
          bunx playwright test \
            tests/module2.spec.ts \
            tests/socketio-verify.spec.ts \
            tests/socket-race.spec.ts \
            tests/realtime-authz.spec.ts \
            tests/widget-external-origin.spec.ts
      - name: Print container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs app realtime postgres redis caddy
      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans

name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
      - name: Lint
        run: bun run lint
      - name: TypeScript check
        run: bun run typecheck
      - name: Prisma validate
        run: bunx prisma validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
      - name: Vercel build script syntax check
        run: bash -n vercel-build.sh
      # AI-Q2 runs only AI-Q2 reviewer + developer tests. Keep complete regression on main and other PRs.
      - name: Unit tests - AI-Q2 Atomic AI Reply Accounting (reviewer + developer)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q2-atomic-usage'
        run: bun test tests/unit/ai-q2-policy.test.ts tests/unit/ai-q2-implementation.test.ts tests/unit/ai-q1-contract.test.ts tests/unit/ai-q1-implementation.test.ts
      # Q4 touches Product Q&A, shared AI, FAQ precedence and atomic billing.
      # Run exactly the relevant immutable unit contracts, not unrelated product/dashboard suites.
      - name: Unit tests - AI-Q4 scoped Q1/Q2/Q3 compatibility and Product Q&A
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q4-grounded-products'
        run: bun test tests/unit/ai-q4-product-contract.test.ts tests/unit/ai-q4-adversarial-review.test.ts tests/unit/ai-q1-contract.test.ts tests/unit/ai-q2-policy.test.ts tests/unit/ai-q3-faq-contract.test.ts tests/unit/ai-q3-faq-adversarial-review.test.ts
      - name: Unit tests - full regression (main and other PRs)
        if: github.event_name != 'pull_request' || (github.head_ref != 'feat/ai-q2-atomic-usage' && github.head_ref != 'feat/ai-q4-grounded-products')
        run: bun test tests/unit/
      - name: Production build
        run: bunx next build
        env:
          VERCEL: '1'
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
          NIXIFY_MOCK: 'true'
          NEXTAUTH_SECRET: 'ci-test-secret-not-for-production'

  # === Widget NPM package qualification (non-publishing) ===
  # Verifies the sukhan-widget package builds, packs cleanly, and installs
  # in clean npm + Bun consumers on the PR exact SHA. This is the SHARED
  # qualification also used by the publish workflow, so the two paths cannot
  # drift. NEVER publishes. Requires NO npm credential.
  widget-package-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        if: github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install
      # Scoped AI-Q2 smoke: prove the NPM widget still compiles, imports on
      # SSR, and exposes no internal test message-ingestion methods.
      # No package installation/publishing or unrelated qualification drill.
      - name: AI-Q2 Atomic AI Reply Accounting - NPM package API/build smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q2-atomic-usage'
        run: |
          cd packages/widget-npm
          bun run build
          test -s dist/index.js
          test -s dist/index.d.ts
          node --input-type=module <<'NODE'
          import { initSukhan } from './dist/index.js'
          const instance = initSukhan({ apiKey: 'ci-playground-test-key' })
          for (const key of ['open', 'close', 'toggle', 'send', 'destroy', 'setIdentity', 'refreshIdentity']) {
            if (typeof instance[key] !== 'function') throw new Error('Missing public API: ' + key)
          }
          if ('__ingestMessage' in instance) throw new Error('Test-only message injection exposed publicly')
          console.log('NPM widget build + SSR public API smoke passed')
          NODE
      - name: Run shared widget package qualification - main/other PRs
        if: github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage'
        run: bash scripts/qualify-widget-package.sh
        env:
          REPO_ROOT: ${{ github.workspace }}

  docker-regression:
    runs-on: ubuntu-latest
    # Bumped 30→60: the browser suites grew to 151 tests × 2 editions (Full +
    # Lite) across the visitor-access-modes phases (NPM identity, script
    # identity, dashboard Access & Identity) + the connectAndWait safety-net
    # timeout (12s) + the identity/dashboard specs' waits. The job now exceeds
    # the prior 30-min limit → cancelled by the timeout (not a code failure).
    # 60 min gives comfortable headroom; local/CI runs finish in ~30-35 min.
    timeout-minutes: 60
    env:
      NEXTAUTH_SECRET: ci-docker-test-secret-not-production
      POSTGRES_PASSWORD: ci-postgres-password
      NIXIFY_MOCK: "true"
      # Dedicated test-harness flag for dev-only test routes (BLOCKER 3).
      # Set ONLY in Docker test stacks. Production compose + Vercel unset.
      SUKHAN_TEST_HARNESS: "true"
      # Direct Postgres connection for the bun db-boundary test runner
      # (runs on the CI host, connects to the exposed Docker Postgres port).
      DATABASE_URL: postgresql://sukhan:ci-postgres-password@127.0.0.1:5432/sukhan?schema=public
      DIRECT_URL: postgresql://sukhan:ci-postgres-password@127.0.0.1:5432/sukhan?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Prisma generate
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Build the image once — both Full and Lite reuse it.
      - name: Build Docker image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml build app

      # === Full edition ===
      - name: Start Full Docker stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --no-build
      - name: Wait for Full health
        run: |
          echo "Waiting for Full services to be healthy..."
          timeout 180 bash -c '
            while true; do
              APP=$(curl -sf -o /dev/null http://127.0.0.1:3000/api 2>/dev/null && echo ok || echo fail)
              CADDY=$(curl -sf -o /dev/null http://127.0.0.1:81/api 2>/dev/null && echo ok || echo fail)
              if [ "$APP" = "ok" ] && [ "$CADDY" = "ok" ]; then
                echo "Full stack healthy"
                exit 0
              fi
              echo "  app=$APP caddy=$CADDY"
              sleep 5
            done
          '
      - name: Run Full DB boundary tests - AI-Q4 product, Q2 usage and Q3 FAQ
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q4-grounded-products'
        run: bun test tests/db-boundary/ai-q4-products.test.ts tests/db-boundary/ai-q2-usage.test.ts tests/db-boundary/ai-q3-faq.test.ts
      - name: Run Full DB boundary tests (real PostgreSQL)
        if: github.event_name != 'pull_request' || (github.head_ref != 'feat/ai-q2-atomic-usage' && github.head_ref != 'feat/ai-q4-grounded-products')
        run: bun test tests/db-boundary/
      # AI-Q2: only AI-Q2 browser tests (Free + Pro, all 3 widget surfaces, safe link targets, downgrade + upgrade).
      # AI-Q2 must run real PostgreSQL concurrency AND legacy billing-state-machine compatibility.
      - name: Run Full DB boundary tests - AI-Q2 + billing compatibility
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q2-atomic-usage'
        run: bun test tests/db-boundary/ai-q2-usage.test.ts tests/db-boundary/billing-state-machine.test.ts
      - name: Run Full browser tests - AI-Q2 Atomic AI Reply Accounting only
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q2-atomic-usage'
        run: bunx playwright test tests/ai-q2-usage.spec.ts --workers=1 --retries=0
      # Q4 covers exact product answers, FAQ precedence, Free/Pro quota,
      # HTTP retry, conflicting keys and eight-way concurrency itself.
      # The full 200+ E2E suite remains mandatory on main and other PRs.
      - name: Run Full browser tests - AI-Q4 focused acceptance
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q4-grounded-products'
        run: bunx playwright test tests/ai-q4-products.spec.ts --workers=1 --retries=0
      - name: Run Full regression tests - main and other PRs
        if: github.event_name != 'pull_request' || (github.head_ref != 'feat/ai-q2-atomic-usage' && github.head_ref != 'feat/ai-q4-grounded-products')
        run: |
          bunx playwright test             tests/module2.spec.ts             tests/socketio-verify.spec.ts             tests/socket-race.spec.ts             tests/realtime-authz.spec.ts             tests/widget-external-origin.spec.ts tests/reconnect-regression.spec.ts tests/tenant-security.spec.ts tests/inbox-reply-echo-dedup.spec.ts tests/inbox-stale-selection.spec.ts tests/widget-npm-external-origin.spec.ts tests/widget-npm-identity.spec.ts tests/widget-script-identity.spec.ts tests/widget-access-identity-dashboard.spec.ts tests/inbox-burst-dedup.spec.ts tests/onboarding.spec.ts tests/anonymous-isolation.spec.ts tests/widget-live-messaging.spec.ts tests/widget-optimistic-failure.spec.ts tests/widget-duplicate-messages.spec.ts tests/widget-adversarial-ordering.spec.ts tests/caddy-public-boundary.spec.ts tests/invite-workspace-switching.spec.ts tests/widget-customization.spec.ts tests/widget-v2-positioning.spec.ts tests/widget-v2-colors.spec.ts tests/widget-domains.spec.ts tests/ai-q1-config.spec.ts tests/ai-q2-usage.spec.ts tests/ai-q3-faq.spec.ts tests/ai-q4-products.spec.ts tests/analytics-csat.spec.ts tests/workspace-switcher.spec.ts tests/password-reset.spec.ts tests/contacts-identity.spec.ts tests/auth-session-stress.spec.ts
      - name: Print Full container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs app realtime postgres redis caddy || true
      - name: Tear down Full
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans || true

      # === Lite edition ===
      - name: Start Lite Docker stack
        run: |
          docker compose -f docker-compose.lite.yml -f docker-compose.lite.test.yml up -d --no-build
      - name: Wait for Lite health
        run: |
          echo "Waiting for Lite services to be healthy..."
          timeout 180 bash -c '
            while true; do
              APP=$(curl -sf -o /dev/null http://127.0.0.1:3000/api 2>/dev/null && echo ok || echo fail)
              CADDY=$(curl -sf -o /dev/null http://127.0.0.1:81/api 2>/dev/null && echo ok || echo fail)
              if [ "$APP" = "ok" ] && [ "$CADDY" = "ok" ]; then
                echo "Lite stack healthy"
                exit 0
              fi
              echo "  app=$APP caddy=$CADDY"
              sleep 5
            done
          '
      - name: Run Lite DB boundary tests - AI-Q4 product, Q2 usage and Q3 FAQ
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q4-grounded-products'
        run: bun test tests/db-boundary/ai-q4-products.test.ts tests/db-boundary/ai-q2-usage.test.ts tests/db-boundary/ai-q3-faq.test.ts
      - name: Run Lite DB boundary tests (real PostgreSQL)
        if: github.event_name != 'pull_request' || (github.head_ref != 'feat/ai-q2-atomic-usage' && github.head_ref != 'feat/ai-q4-grounded-products')
        run: bun test tests/db-boundary/
      # AI-Q2: only AI-Q2 browser tests (Free + Pro, all widget surfaces, downgrade).
      # AI-Q2 must run real PostgreSQL concurrency AND legacy billing-state-machine compatibility.
      - name: Run Lite DB boundary tests - AI-Q2 + billing compatibility
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q2-atomic-usage'
        run: bun test tests/db-boundary/ai-q2-usage.test.ts tests/db-boundary/billing-state-machine.test.ts
      - name: Run Lite browser tests - AI-Q2 Atomic AI Reply Accounting only
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q2-atomic-usage'
        run: bunx playwright test tests/ai-q2-usage.spec.ts --workers=1 --retries=0
      - name: Run Lite browser tests - AI-Q4 focused acceptance
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q4-grounded-products'
        run: bunx playwright test tests/ai-q4-products.spec.ts --workers=1 --retries=0
      - name: Run Lite regression tests - main and other PRs
        if: github.event_name != 'pull_request' || (github.head_ref != 'feat/ai-q2-atomic-usage' && github.head_ref != 'feat/ai-q4-grounded-products')
        run: |
          bunx playwright test             tests/module2.spec.ts             tests/socketio-verify.spec.ts             tests/socket-race.spec.ts             tests/realtime-authz.spec.ts             tests/widget-external-origin.spec.ts tests/reconnect-regression.spec.ts tests/tenant-security.spec.ts tests/inbox-reply-echo-dedup.spec.ts tests/inbox-stale-selection.spec.ts tests/widget-npm-external-origin.spec.ts tests/widget-npm-identity.spec.ts tests/widget-script-identity.spec.ts tests/widget-access-identity-dashboard.spec.ts tests/inbox-burst-dedup.spec.ts tests/onboarding.spec.ts tests/anonymous-isolation.spec.ts tests/widget-live-messaging.spec.ts tests/widget-optimistic-failure.spec.ts tests/widget-duplicate-messages.spec.ts tests/widget-adversarial-ordering.spec.ts tests/caddy-public-boundary.spec.ts tests/invite-workspace-switching.spec.ts tests/widget-customization.spec.ts tests/widget-v2-positioning.spec.ts tests/widget-v2-colors.spec.ts tests/widget-domains.spec.ts tests/ai-q1-config.spec.ts tests/ai-q2-usage.spec.ts tests/ai-q3-faq.spec.ts tests/ai-q4-products.spec.ts tests/analytics-csat.spec.ts tests/workspace-switcher.spec.ts tests/password-reset.spec.ts tests/contacts-identity.spec.ts tests/auth-session-stress.spec.ts
      - name: Print Lite container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.lite.yml -f docker-compose.lite.test.yml logs app realtime postgres caddy || true
      - name: Tear down Lite
        if: always()
        run: |
          docker compose -f docker-compose.lite.yml -f docker-compose.lite.test.yml down -v --remove-orphans || true

  # === Self-host release qualification ===
  # Production-shape clean-install + destructive backup/restore drill.
  # Uses ONLY production compose files (no test overrides). Access through
  # Caddy on port 80 only. No internal service host exposure.
  self-host-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXTAUTH_SECRET: ci-docker-test-secret-not-production
      POSTGRES_PASSWORD: ci-postgres-password
      NIXIFY_MOCK: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      # Scoped AI-Q2 smoke: validate both production deployment topologies
      # without building images or repeating destructive backup/restore drills.
      - name: AI-Q2 Atomic AI Reply Accounting - Full/Lite production Compose config smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ai-q2-atomic-usage'
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.lite.yml config -q
          echo 'Full and Lite production Compose configs are valid'
      - name: Setup Bun
        if: github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage'
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage'
        run: bun install
      - name: Prisma generate
        if: github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage'
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage'
        run: bunx playwright install --with-deps chromium

      # Build the image once (reuses the cache from the docker-regression job
      # if it ran first; otherwise builds fresh).
      - name: Build Docker image
        if: github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage'
        run: |
          docker compose -f docker-compose.yml build app

      # Run the production-shape qualification tests. These tests manage
      # their own Docker containers (start/stop/destroy/restore) using
      # the production compose files. They access the app through Caddy
      # on port 80 only — no internal service host exposure.
      - name: Run self-host qualification tests (Full + Lite) - main/other PRs
        if: github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage'
        run: |
          bunx playwright test \
            tests/self-host-backup-restore.spec.ts \
            tests/self-host-clean-install.spec.ts

      - name: Print container logs on failure
        if: failure() && (github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage')
        run: |
          docker compose -p sukhan-bakres-full logs 2>/dev/null || true
          docker compose -p sukhan-bakres-lite logs 2>/dev/null || true
          docker compose -p sukhan-clean-full logs 2>/dev/null || true
          docker compose -p sukhan-clean-lite logs 2>/dev/null || true
      - name: Tear down any remaining stacks
        if: always() && (github.event_name != 'pull_request' || github.head_ref != 'feat/ai-q2-atomic-usage')
        run: |
          docker compose -p sukhan-bakres-full down -v --remove-orphans 2>/dev/null || true
          docker compose -p sukhan-bakres-lite down -v --remove-orphans 2>/dev/null || true
          docker compose -p sukhan-clean-full down -v --remove-orphans 2>/dev/null || true
          docker compose -p sukhan-clean-lite down -v --remove-orphans 2>/dev/null || true

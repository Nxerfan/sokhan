name: Smart Avoidance — independent acceptance preflight
on:
  push:
    branches:
      - feat/widget-v2-smart-avoidance
    paths:
      - tests/unit/widget-v2-smart-avoidance.test.ts
      - tests/widget-v2-smart-avoidance.spec.ts
      - .github/workflows/smart-avoidance-preflight.yml

jobs:
  test-harness-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Parse reviewer-owned Unit and Playwright TypeScript
        run: |
          node --input-type=module <<'NODE'
          import ts from 'typescript'
          import { readFileSync } from 'node:fs'
          for (const file of [
            'tests/unit/widget-v2-smart-avoidance.test.ts',
            'tests/widget-v2-smart-avoidance.spec.ts',
          ]) {
            const source = ts.createSourceFile(file, readFileSync(file, 'utf8'), ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            if (source.parseDiagnostics.length > 0) {
              for (const d of source.parseDiagnostics)
                console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'))
              throw Error('Invalid TypeScript syntax in ' + file)
            }
            console.log('Syntax OK: ' + file)
          }
          NODE
      - name: Discover real browser acceptance scenarios
        run: bunx playwright test tests/widget-v2-smart-avoidance.spec.ts --list

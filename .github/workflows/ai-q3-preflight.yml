name: AI-Q3 — independent reviewer FAQ acceptance preflight
on:
  push:
    branches:
      - feat/ai-q3-faq-confidence
  pull_request:
    branches:
      - main

jobs:
  reviewer-ai-q3-preflight:
    if: github.event_name == 'push' || github.head_ref == 'feat/ai-q3-faq-confidence'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install immutable dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client BEFORE importing Playwright test helpers
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/dummy
          DIRECT_URL: postgresql://user:password@localhost:5432/dummy
      - name: Enforce reviewer-owned acceptance test content integrity
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          const hashes={
            'tests/unit/ai-q3-faq-contract.test.ts':'5038fb8036b8699bb9c048c58a82007ddf6938ba',
            'tests/db-boundary/ai-q3-faq.test.ts':'fbe9032979f62d3546438725c446aabd2d28f28f',
            'tests/ai-q3-faq.spec.ts':'4b73548ba4dab02b551993ae46e3c3d5f8bf2355',
            'tests/unit/ai-q3-faq-adversarial-review.test.ts':'83b4441bfb6997db5f79c5762f18c5f9ff00de2f',
          }
          for(const [file,expected] of Object.entries(hashes)){
            const actual=execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim()
            if(actual!==expected)throw Error('Reviewer acceptance file was modified: '+file)
            console.log('Reviewer-owned integrity OK: '+file)
          }
          NODE
      - name: Syntax-check all three reviewer-owned AI-Q3 suites
        run: |
          node --input-type=module <<'NODE'
          import ts from 'typescript'
          import { readFileSync } from 'node:fs'
          for(const file of [
            'tests/unit/ai-q3-faq-contract.test.ts',
            'tests/unit/ai-q3-faq-adversarial-review.test.ts',
            'tests/db-boundary/ai-q3-faq.test.ts',
            'tests/ai-q3-faq.spec.ts'
          ]) {
            const text=readFileSync(file,'utf8')
            const source=ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS)
            if(source.parseDiagnostics.length) {
              for(const d of source.parseDiagnostics) {
                console.error(file+': '+ts.flattenDiagnosticMessageText(d.messageText,'\n'))
              }
              process.exitCode=1
            } else console.log('Syntax OK: '+file)
          }
          NODE
      - name: Run immutable reviewer adversarial FAQ behavior regression
        run: bun test tests/unit/ai-q3-faq-adversarial-review.test.ts
      - name: Enumerate real Playwright acceptance without launching app
        run: bunx playwright test tests/ai-q3-faq.spec.ts --list
      - name: Verify full Full/Lite CI includes new reviewer browser suite
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const ci=readFileSync('.github/workflows/ci.yml','utf8')
          const full=ci.split('name: Run Full regression tests - main and other PRs')[1]?.split('name: Print Full container logs on failure')[0] ?? ''
          const lite=ci.split('name: Run Lite regression tests - main and other PRs')[1]?.split('name: Print Lite container logs on failure')[0] ?? ''
          for(const [label,s] of [['Full',full],['Lite',lite]]) {
            for(const path of ['tests/ai-q1-config.spec.ts','tests/ai-q2-usage.spec.ts','tests/ai-q3-faq.spec.ts']) {
              if(!s.includes(path)) throw Error(label+' CI missing reviewer acceptance suite: '+path)
              console.log(label+' includes '+path)
            }
          }
          NODE
